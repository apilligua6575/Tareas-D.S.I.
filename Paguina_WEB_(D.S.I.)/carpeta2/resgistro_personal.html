<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hoja de Registro</title>
</head>
<body>
    
    <nav>
        <a href="/Index.html">Volver a INICIO</a>
        <h2>Crear una cuenta</h2>
    </nav>

    <form action="">    
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Alexander Pilligua" required><br><br>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" placeholder="Ej. 30"><br><br>
        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required><br><br>
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion" placeholder="Ej. Portoviejo Av.Cordova"><br><br>
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej. 0991234567"><br><br>
        
        <button type="submit">Registrarse</button>
        <button type="reset">Limpiar</button>
    </form>

</html>
